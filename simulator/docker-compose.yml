services:
  simulator:
    build: .
    ports:
      - "${HTTP_PORT:-80}:8080"
    environment:
      SIMULATOR_DATABASE: /data/exams.sqlite3
      SIMULATOR_COOKIE_SECURE: "${SIMULATOR_COOKIE_SECURE:-false}"
      SIMULATOR_PUBLIC_ORIGIN: "${SIMULATOR_PUBLIC_ORIGIN:-}"
    volumes:
      - exam-data:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  exam-data:
